<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SafePlate Korea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2F7A68; --brand-dark:#1E5347; --brand-tint:#E7F1EE;
  --ink:#17241F; --ink-soft:#5B6B64;
  --bg:#F4F7F5; --card:#FFFFFF; --line:#E1E8E4;
  --safe:#1E8A5B; --safe-bg:#E4F4EC;
  --caution:#B47B00; --caution-bg:#FBF1DA;
  --avoid:#C6423A; --avoid-bg:#FBE7E5;
  --radius:16px;
  --font-ui:'IBM Plex Sans KR',-apple-system,sans-serif;
  --font-display:'Gowun Batang',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-ui);background:#DDE5E1;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
#phone{width:100%;max-width:420px;background:var(--bg);min-height:100vh;position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(23,36,31,.12)}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(244,247,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px 10px}
.brand-row{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--brand-dark)}
.brand small{font-family:var(--font-ui);font-weight:500;font-size:11px;color:var(--ink-soft);margin-inline-start:6px}
.loc-chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:5px;cursor:pointer;font-family:var(--font-ui)}
.loc-chip svg{width:12px;height:12px;fill:var(--brand)}
.profile-strip{margin-top:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.profile-strip::-webkit-scrollbar{display:none}
.ptag{flex:0 0 auto;font-size:11.5px;font-weight:500;background:var(--brand-tint);color:var(--brand-dark);border-radius:999px;padding:4px 10px}
.ptag.empty{background:transparent;border:1px dashed var(--line);color:var(--ink-soft)}

/* screens */
main{flex:1;overflow-y:auto;padding-bottom:86px}
.screen{display:none;animation:fade .25s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen,.w-line{animation:none!important}}

/* explore */
.section-label{padding:16px 18px 8px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--ink-soft);text-transform:uppercase}
.legend{margin:10px 18px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;justify-content:space-between;gap:6px}
.legend div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.dot.g{background:var(--safe)}.dot.y{background:var(--caution)}.dot.r{background:var(--avoid)}
.rest-list{padding:6px 18px 20px;display:flex;flex-direction:column;gap:10px}
.rest-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:border-color .15s}
.rest-card:active{border-color:var(--brand)}
.plate{flex:0 0 46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;position:relative}
.plate::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:.28}
.plate.g{background:var(--safe-bg);color:var(--safe)}
.plate.y{background:var(--caution-bg);color:var(--caution)}
.plate.r{background:var(--avoid-bg);color:var(--avoid)}
.rest-info{flex:1;min-width:0}
.rest-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.halal-badge{font-size:10px;background:var(--brand-tint);color:var(--brand-dark);border-radius:6px;padding:2px 6px;font-weight:700}
.rest-cat{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.rest-verdict{font-size:12px;margin-top:7px;font-weight:500}
.rest-verdict.g{color:var(--safe)}.rest-verdict.y{color:var(--caution)}.rest-verdict.r{color:var(--avoid)}
.rest-meta{font-size:11px;color:var(--ink-soft);margin-top:3px}

/* detail */
.detail-hero{padding:20px 18px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.back-btn{background:none;border:none;font-family:var(--font-ui);font-size:13px;font-weight:500;color:var(--brand-dark);cursor:pointer;padding:0 0 12px;display:flex;align-items:center;gap:4px}
.detail-name{font-family:var(--font-display);font-size:22px;font-weight:700}
.detail-sub{font-size:12.5px;color:var(--ink-soft);margin-top:5px;line-height:1.5}
.detail-badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 13px}
.detail-badge.g{background:var(--safe-bg);color:var(--safe)}
.detail-badge.y{background:var(--caution-bg);color:var(--caution)}
.detail-badge.r{background:var(--avoid-bg);color:var(--avoid)}
.menu-list{padding:4px 18px 20px}
.menu-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-top:10px}
.menu-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.menu-name{font-weight:700;font-size:14.5px}
.menu-name small{font-weight:500;color:var(--ink-soft);font-size:11.5px;display:block;margin-top:1px}
.menu-price{font-size:12px;color:var(--ink-soft);margin-top:3px}
.mbadge{flex:0 0 auto;font-size:11px;font-weight:700;border-radius:8px;padding:4px 9px}
.mbadge.g{background:var(--safe-bg);color:var(--safe)}
.mbadge.y{background:var(--caution-bg);color:var(--caution)}
.mbadge.r{background:var(--avoid-bg);color:var(--avoid)}
.menu-reasons{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.reason{font-size:12px;line-height:1.5;color:var(--ink-soft);display:flex;gap:6px}
.reason b{font-weight:700}
.reason.g b{color:var(--safe)}.reason.y b{color:var(--caution)}.reason.r b{color:var(--avoid)}
.source-note{margin:16px 18px 24px;font-size:11px;line-height:1.65;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:12px}

/* safecard (legacy wrap) */
.card-wrap{padding:20px 18px 24px}
.card-intro{font-size:13px;line-height:1.6;color:var(--ink-soft);margin-bottom:14px}

/* ===== dietary ID card ===== */
.idcard{
  position:relative;overflow:hidden;border-radius:18px;
  background:linear-gradient(150deg,#123B32 0%,var(--brand-dark) 45%,var(--brand) 100%);
  color:#F3F8F5;padding:18px 18px 14px;
  box-shadow:0 14px 30px rgba(18,59,50,.32);
  direction:ltr;text-align:left;
}
.idcard::before{ /* guilloche-ish texture */
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    repeating-conic-gradient(from 0deg at 110% -10%, rgba(255,255,255,.05) 0 2deg, transparent 2deg 9deg),
    radial-gradient(circle at 108% -8%, rgba(255,255,255,.10), transparent 46%);
}
.idcard::after{ /* gold hairline */
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,#C9A961 30%,#EAD9AC 50%,#C9A961 70%,transparent);
}
.id-head{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.id-title{font-family:var(--font-display);font-weight:700;font-size:16.5px;letter-spacing:.5px}
.id-title-en{font-size:8.5px;letter-spacing:1.6px;opacity:.7;margin-top:3px;font-weight:700}
.id-emblem{
  width:34px;height:34px;border-radius:50%;flex:0 0 auto;
  border:1.5px solid rgba(234,217,172,.75);color:#EAD9AC;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:13px;
}
.id-body{display:flex;gap:14px;margin-top:14px;position:relative}
.id-photo{
  flex:0 0 64px;height:80px;border-radius:10px;
  background:rgba(243,248,245,.10);border:1px solid rgba(243,248,245,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.id-photo .flag{font-size:30px;line-height:1}
.id-photo .cc{font-size:9px;letter-spacing:1.5px;opacity:.7;font-weight:700}
.id-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.id-field label{display:block;font-size:8.5px;letter-spacing:1.2px;opacity:.65;font-weight:700;margin-bottom:3px}
.id-field .val{font-size:13.5px;font-weight:700;line-height:1.4}
.id-noeat{display:flex;flex-wrap:wrap;gap:5px}
.id-noeat span{
  background:rgba(255,255,255,.94);color:#B3362E;
  font-size:13px;font-weight:700;border-radius:7px;padding:3px 9px;
  font-family:var(--font-ui);
}
.id-caution{display:flex;flex-wrap:wrap;gap:5px}
.id-caution span{
  background:rgba(234,217,172,.22);border:1px solid rgba(234,217,172,.5);color:#EAD9AC;
  font-size:12px;font-weight:700;border-radius:7px;padding:3px 9px;
}
.id-msg{
  margin-top:14px;position:relative;
  font-family:var(--font-display);font-weight:700;font-size:14.5px;line-height:1.55;
  border-top:1px solid rgba(243,248,245,.22);padding-top:11px;word-break:keep-all;
}
.id-foot{
  margin-top:11px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;position:relative;
}
.id-foot .meta{font-size:9px;letter-spacing:1px;opacity:.7;line-height:1.7;font-weight:500}
.id-qr{flex:0 0 auto;background:#F3F8F5;border-radius:6px;padding:4px;display:block}
.pf-card-slot{margin-top:16px}
.pf-card-hint{font-size:11.5px;color:var(--ink-soft);margin-top:9px;line-height:1.55;text-align:center}
.safecard{background:linear-gradient(160deg,var(--brand-dark) 0%,var(--brand) 100%);border-radius:22px;color:#F3F8F5;padding:26px 22px 22px;position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(30,83,71,.28)}
.safecard::before{content:'';position:absolute;top:-34px;inset-inline-end:-34px;width:110px;height:110px;background:rgba(243,248,245,.10);transform:rotate(45deg)}
.safecard .kicker{font-size:10.5px;letter-spacing:2px;font-weight:700;opacity:.75;text-transform:uppercase}
.safecard .big{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.55;margin:14px 0 16px;word-break:keep-all;direction:ltr;text-align:left}
.safecard .sub{font-size:12.5px;line-height:1.6;opacity:.88;border-top:1px solid rgba(243,248,245,.25);padding-top:13px}
.card-hint{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:12px}
.lang-row{display:flex;gap:6px;margin:18px 0 8px;flex-wrap:wrap}
.lang-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font-ui);color:var(--ink)}
.lang-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty-note{margin:14px 0;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:22px 18px;text-align:center;font-size:13px;color:var(--ink-soft);line-height:1.7}

/* nation & reco */
.nat-hint{margin-top:9px;font-size:11.5px;line-height:1.55;color:var(--brand-dark);background:var(--brand-tint);border-radius:10px;padding:8px 11px;display:none}
.nat-hint.show{display:block}
.reco-scroll{display:flex;gap:9px;overflow-x:auto;padding:6px 18px 4px;scrollbar-width:none}
.reco-scroll::-webkit-scrollbar{display:none}
.reco-card{flex:0 0 132px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.reco-rank{font-size:10px;font-weight:700;color:var(--ink-soft)}
.reco-name{font-family:var(--font-display);font-weight:700;font-size:15px;margin-top:4px}
.reco-name small{font-family:var(--font-ui);font-weight:500;font-size:10.5px;color:var(--ink-soft);display:block;margin-top:2px}
.reco-badge{display:inline-block;margin-top:9px;font-size:10.5px;font-weight:700;border-radius:7px;padding:3px 8px}
.reco-badge.g{background:var(--safe-bg);color:var(--safe)}
.reco-badge.y{background:var(--caution-bg);color:var(--caution)}
.reco-badge.r{background:var(--avoid-bg);color:var(--avoid)}
.reco-note{font-size:10.5px;color:var(--ink-soft);margin-top:5px;line-height:1.45}
.reco-src{font-size:10px;color:var(--ink-soft);padding:6px 18px 0}

/* profile */
.prof-wrap{padding:20px 18px 30px}
.prof-title{font-family:var(--font-display);font-size:21px;font-weight:700}
.prof-sub{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.6}
.prof-group{margin-top:22px}
.prof-group h3{font-size:13px;font-weight:700;margin-bottom:4px}
.prof-group h3 span{font-weight:400;color:var(--ink-soft)}
.prof-group p{font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-ui);color:var(--ink);transition:all .12s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip:focus-visible,.lang-btn:focus-visible,.cta:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.cta{width:100%;margin-top:26px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-ui)}
.cta:disabled{opacity:.35;cursor:default}
.cta:active:not(:disabled){opacity:.85}

/* ===== welcome (step 1) ===== */
#cover{position:absolute;inset:0;z-index:40;background:var(--bg);overflow-y:auto}
.cover-step{display:none;min-height:100%}
.cover-step.active{display:flex;flex-direction:column}
.welcome-art{background:linear-gradient(168deg,var(--brand-dark) 0%,var(--brand) 62%,#4E9583 100%);color:#F3F8F5;padding:64px 26px 36px;position:relative;overflow:hidden}
.welcome-art::after{content:'환영합니다';position:absolute;bottom:-26px;inset-inline-end:-8px;font-family:var(--font-display);font-size:96px;font-weight:700;opacity:.06;white-space:nowrap;pointer-events:none}
.w-kicker{font-size:11px;letter-spacing:2.5px;font-weight:700;opacity:.8}
.w-title{font-family:var(--font-display);font-size:34px;line-height:1.35;margin-top:16px;font-weight:700;word-break:keep-all}
.w-sub{font-size:14px;line-height:1.75;margin-top:16px;opacity:.94;word-break:keep-all}
.w-line{animation:fade .5s ease both}
.welcome-body{padding:22px 26px 34px;flex:1}
.w-q{font-size:14px;font-weight:700}
.w-note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.nation-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.nation-btn{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:12px 6px 10px;cursor:pointer;font-family:var(--font-ui);text-align:center;transition:all .12s}
.nation-btn .f{font-size:22px;display:block}
.nation-btn .n{font-size:11.5px;font-weight:500;margin-top:4px;display:block;color:var(--ink)}
.nation-btn.on{background:var(--brand);border-color:var(--brand)}
.nation-btn.on .n{color:#fff;font-weight:700}
.w-greet{margin-top:16px;font-size:13.5px;line-height:1.7;color:var(--brand-dark);background:var(--brand-tint);border-radius:12px;padding:12px 14px;display:none;word-break:keep-all}
.w-greet.show{display:block;animation:fade .3s ease}
/* onboarding (step 2) wizard */
.ob-head{padding:46px 26px 6px}
.ob-progress{display:flex;align-items:center;gap:5px;margin-bottom:18px}
.ob-progress .seg{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background .2s}
.ob-progress .seg.on{background:var(--brand)}
.ob-progress .cnt{font-size:11px;font-weight:700;color:var(--ink-soft);margin-inline-start:6px;flex:0 0 auto}
.ob-title{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.4;word-break:keep-all}
.ob-sub{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.6}
.ob-body{padding:16px 26px 34px;flex:1;display:flex;flex-direction:column}
.ob-panel{display:none;animation:fade .25s ease}
.ob-nav{display:flex;gap:10px;margin-top:auto;padding-top:26px}
.ob-nav .cta{margin-top:0}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);flex:0 0 34%}
.etc-input{
  width:100%;border:1px solid var(--line);border-radius:14px;background:var(--card);
  padding:13px 14px;font-family:var(--font-ui);font-size:13.5px;line-height:1.6;color:var(--ink);
  resize:vertical;min-height:120px;
}
.etc-input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}

/* bottom nav */
nav{position:absolute;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;font-family:var(--font-ui);cursor:pointer;font-size:10.5px;font-weight:500;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0}
nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand-dark);font-weight:700}
</style>
</head>
<body>
<div id="phone">

  <!-- ===== cover: step 1 welcome / step 2 profile ===== -->
  <div id="cover">
    <div class="cover-step active" id="step-welcome">
      <div class="welcome-art">
        <div class="w-kicker">SAFEPLATE KOREA</div>
        <div class="w-title w-line" id="w-title">Welcome to Korea 🇰🇷</div>
        <div class="w-sub w-line" id="w-sub" style="animation-delay:.12s">
          We're truly glad you're here.<br>
          먼 길 오시느라 고생 많으셨어요. 진심으로 환영합니다.
        </div>
      </div>
      <div class="welcome-body">
        <div class="w-q" id="w-q">Where are you visiting from?</div>
        <div class="w-note" id="w-note">We'll greet you in your language. If yours isn't supported yet, we'll use English.</div>
        <div class="nation-grid" id="nation-grid"></div>
        <div class="w-greet" id="w-greet"></div>
        <button class="cta" id="w-continue" disabled onclick="goStep2()">Continue</button>
      </div>
    </div>

    <div class="cover-step" id="step-profile">
      <div class="ob-head">
        <div class="ob-progress" id="ob-progress"></div>
        <div class="ob-title" id="ob-title"></div>
        <div class="ob-sub" id="ob-sub"></div>
      </div>
      <div class="ob-body">
        <div class="ob-panel" id="panel-cond"><div class="chips" id="ob-cond"></div></div>
        <div class="ob-panel" id="panel-alg"><div class="chips" id="ob-alg"></div></div>
        <div class="ob-panel" id="panel-rel">
          <div class="chips" id="ob-rel"></div>
          <div class="nat-hint" id="ob-nat-hint"></div>
        </div>
        <div class="ob-panel" id="panel-etc">
          <textarea id="ob-etc" class="etc-input" rows="5"></textarea>
        </div>
        <div class="ob-nav">
          <button class="cta ghost" id="ob-back" onclick="obPrev()"></button>
          <button class="cta" id="ob-next" onclick="obNext()"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== header ===== -->
  <header>
    <div class="brand-row">
      <div class="brand">SafePlate <small>KOREA</small></div>
      <button class="loc-chip" onclick="toggleArea()">
        <svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
        <span id="area-name"></span> ▾
      </button>
    </div>
    <div class="profile-strip" id="profile-strip"></div>
  </header>

  <main>
    <section class="screen" id="scr-explore">
      <div id="reco-section"></div>
      <div class="legend" id="legend"></div>
      <div class="section-label" id="rest-count-label"></div>
      <div class="rest-list" id="rest-list"></div>

let profile = {cond:[], alg:[], rel:[], nation:null, etc:''};
let uiLang = 'en';

/* ================= verdict engine ================= */
const LAND = ['pork','beef','chicken','meat'];
const SEA = ['fish','shellfish','mollusk'];
function judgeMenu(m){
  const s = t(); const reasons = []; let level = 'g';
  const bump = l => { if(l==='r') level='r'; else if(l==='y' && level!=='r') level='y'; };
  const has = x => m.tags.includes(x);
  const hasAny = arr => arr.some(has);

  /* allergens: profile ids == ingredient tag ids */
  profile.alg.forEach(a=>{
    if(has(a)){
      if(m.adjustable && m.adjustable.includes(a)){ bump('y'); reasons.push({level:'y', text:s.r_adjust(tl(a))}); }
      else { bump('r'); reasons.push({level:'r', text:s.r_contain(tl(a))}); }
    } else if(m.cross && m.cross.includes(a)){ bump('y'); reasons.push({level:'y', text:s.r_cross(tl(a))}); }
  });

  /* halal: pork/alcohol out; other meat needs slaughter check */
  if(profile.rel.includes('halal')){
    if(has('pork') || has('alcohol')){ bump('r'); reasons.push({level:'r', text:s.r_pork}); }
    else if(m.halalOk){ reasons.push({level:'g', text:s.r_halalOk}); }
    else if(hasAny(LAND)){ bump('y'); reasons.push({level:'y', text:s.r_halalCheck}); }
  }
  /* kosher: pork/shellfish/mollusk out; meat+dairy mix out; meat needs kosher check */
  if(profile.rel.includes('kosher')){
    if(has('pork') || has('shellfish') || has('mollusk')){ bump('r'); reasons.push({level:'r', text:s.r_koNo}); }
    else if(hasAny(LAND) && has('milk')){ bump('r'); reasons.push({level:'r', text:s.r_koMix}); }
    else if(hasAny(LAND)){ bump('y'); reasons.push({level:'y', text:s.r_koCheck}); }
  }
  /* hindu: beef out; generic meat needs species check */
  if(profile.rel.includes('hindu')){
    if(has('beef')){ bump('r'); reasons.push({level:'r', text:s.r_hindu}); }
    else if(has('meat')){ bump('y'); reasons.push({level:'y', text:s.r_hinduCheck}); }
  }
  /* buddhist temple diet: no flesh, no pungent vegetables */
  if(profile.rel.includes('buddhist')){
    if(hasAny(LAND) || hasAny(SEA)){ bump('r'); reasons.push({level:'r', text:s.r_flesh}); }
    else if(has('pungent')){ bump('r'); reasons.push({level:'r', text:s.r_pungent}); }
    else if(m.veganOk){ reasons.push({level:'g', text:s.r_vegiOk}); }
    else { bump('y'); reasons.push({level:'y', text:s.r_pungentCheck}); }
  }
  /* vegan: no flesh, no egg/dairy */
  if(profile.rel.includes('vegan')){
    if(hasAny(LAND) || hasAny(SEA)){ bump('r'); reasons.push({level:'r', text:s.r_flesh}); }
    else if(has('egg') || has('milk')){ bump('r'); reasons.push({level:'r', text:s.r_veganNo}); }
    else if(m.veganOk){ reasons.push({level:'g', text:s.r_veganOk}); }
    else { bump('y'); reasons.push({level:'y', text:s.r_vegiCheck}); }
  }
  /* lacto-ovo vegetarian */
  if(profile.rel.includes('vegi')){
    if(hasAny(LAND) || hasAny(SEA)){ bump('r'); reasons.push({level:'r', text:s.r_flesh}); }
    else if(m.vegiOk || m.veganOk){ reasons.push({level:'g', text:s.r_vegiOk}); }
    else { bump('y'); reasons.push({level:'y', text:s.r_vegiCheck}); }
  }
  /* pescatarian: land meat out, seafood fine */
  if(profile.rel.includes('pesco')){
    if(hasAny(LAND)){ bump('r'); reasons.push({level:'r', text:s.r_pescoNo}); }
    else if(!hasAny(SEA) && !m.vegiOk && !m.veganOk){ bump('y'); reasons.push({level:'y', text:s.r_vegiCheck}); }
  }

  if(profile.cond.includes('sodium')){
    if(m.sodium==='high'){ bump('y'); reasons.push({level:'y', text:s.r_naHigh}); }
    else if(m.sodium==='low'){ reasons.push({level:'g', text:s.r_naLow}); }
  }
  if(profile.cond.includes('sugar')){
    if(m.sugar==='high'){ bump('y'); reasons.push({level:'y', text:s.r_suHigh}); }
    else if(m.sugar==='low'){ reasons.push({level:'g', text:s.r_suLow}); }
  }
  if(profile.cond.includes('gout') && m.purine==='high'){ bump('y'); reasons.push({level:'y', text:s.r_purine}); }
  if(profile.cond.includes('lipid') && m.fat==='high'){ bump('y'); reasons.push({level:'y', text:s.r_fat}); }
  if(profile.cond.includes('gerd') && m.spicy==='high'){ bump('y'); reasons.push({level:'y', text:s.r_spicy}); }
  if(profile.cond.includes('gluten')){
    if(has('wheat')){ bump('r'); reasons.push({level:'r', text:s.r_glu}); }
    else if(has('soy')){ bump('y'); reasons.push({level:'y', text:s.r_gluSoy}); }
  }
  if(reasons.length===0) reasons.push({level:'g', text:s.r_none});
  return {level, reasons};
}
function judgeRestaurant(r){
  const s = t();
  const vs = r.menus.map(judgeMenu);
  const safe = vs.filter(v=>v.level==='g').length;
  const cond = vs.filter(v=>v.level==='y').length;
  if(safe>0) return {level:'g', text:s.vSafe(safe,cond)};
  if(cond>0) return {level:'y', text:s.vCond(cond)};
  return {level:'r', text:s.vNone};
}

/* ================= welcome / onboarding ================= */
let pendingNation = null;
function renderWelcome(){
  const w = WELCOME[uiLang] || WELCOME.en;
  document.getElementById('w-title').innerHTML = w.title;
  document.getElementById('w-sub').innerHTML = w.sub;
  document.getElementById('w-q').textContent = w.q;
  document.getElementById('w-note').textContent = w.note;
  document.getElementById('w-continue').textContent = w.cont;
  document.getElementById('nation-grid').innerHTML = NATIONS.map(n=>
    `<button class="nation-btn ${pendingNation===n.id?'on':''}" onclick="pickNation('${n.id}')">
      <span class="f">${n.flag}</span><span class="n">${n.label[uiLang]||n.label.en}</span>
    </button>`).join('');
  const g = document.getElementById('w-greet');
  if(pendingNation){ g.textContent = t().welcomeGreet; g.classList.add('show'); }
  else g.classList.remove('show');
  document.getElementById('w-continue').disabled = !pendingNation;
}
function pickNation(id){
  pendingNation = id;
  const n = NATIONS.find(x=>x.id===id);
  uiLang = n.lang; currentLang = (n.lang==='ko')?'en':n.lang;
  applyDir();
  renderWelcome();
}
function goStep2(){
  profile.nation = pendingNation;
  document.getElementById('step-welcome').classList.remove('active');
  document.getElementById('step-profile').classList.add('active');
  obStep = 0;
  renderStatic(); refresh(); renderWizard();
  document.getElementById('cover').scrollTop = 0;
}
/* --- profile wizard --- */
let obStep = 0;
const OB_STEPS = ['cond','alg','rel','etc'];
function renderWizard(){
  const s = t();
  const defs = {cond:[s.condT,s.condD], alg:[s.algT,s.algD], rel:[s.relT,s.relD], etc:[s.etcT,s.etcD]};
  const key = OB_STEPS[obStep];
  document.getElementById('ob-title').textContent = defs[key][0];
  document.getElementById('ob-sub').textContent = defs[key][1];
  OB_STEPS.forEach((k,i)=>{ document.getElementById('panel-'+k).style.display = (i===obStep?'block':'none'); });
  document.getElementById('ob-progress').innerHTML =
    OB_STEPS.map((k,i)=>`<span class="seg ${i<=obStep?'on':''}"></span>`).join('') +
    `<span class="cnt">${obStep+1} / ${OB_STEPS.length}</span>`;
  const back = document.getElementById('ob-back');
  back.style.visibility = obStep===0 ? 'hidden' : 'visible';
  back.textContent = s.backBtn;
  document.getElementById('ob-next').textContent = (obStep===OB_STEPS.length-1) ? s.start : s.nextBtn;
  const ta = document.getElementById('ob-etc');
  ta.placeholder = s.etcPh; ta.value = profile.etc || '';
}
function obNext(){
  if(OB_STEPS[obStep]==='etc') profile.etc = document.getElementById('ob-etc').value.trim();
  if(obStep < OB_STEPS.length-1){ obStep++; renderWizard(); document.getElementById('cover').scrollTop = 0; }
  else finishOnboarding();
}
function obPrev(){ if(obStep>0){ obStep--; renderWizard(); } }
function finishOnboarding(){
  document.getElementById('cover').style.display='none';
  renderStatic(); refresh();
  go('card');
}
function applyDir(){
  document.getElementById('phone').dir = (uiLang==='ar') ? 'rtl' : 'ltr';
}

/* ================= static UI text ================= */
function renderStatic(){
  const s = t();
  document.getElementById('pf-etc-t').textContent = s.etcT;
  document.getElementById('pf-etc-d').textContent = s.etcD;
  const pfe = document.getElementById('pf-etc');
  pfe.placeholder = s.etcPh;
  if(document.activeElement !== pfe) pfe.value = profile.etc || '';
  document.getElementById('legend').innerHTML =
    `<div><span class="dot g"></span>${s.legend[0]}</div><div><span class="dot y"></span>${s.legend[1]}</div><div><span class="dot r"></span>${s.legend[2]}</div>`;
  document.getElementById('explore-note').innerHTML = s.exploreNote;
  document.getElementById('pf-title').textContent = s.pfTitle;
  document.getElementById('pf-sub').textContent = s.pfSub;
  document.getElementById('pf-nat-t').innerHTML = `${s.natT} <span>${s.optional}</span>`;
  document.getElementById('pf-nat-d').textContent = s.natD;
  document.getElementById('pf-cond-t').textContent = s.condT;
  document.getElementById('pf-cond-d').textContent = s.condD;
  document.getElementById('pf-alg-t').textContent = s.algT;
  document.getElementById('pf-alg-d').textContent = s.algD;
  document.getElementById('pf-rel-t').textContent = s.relT;
  document.getElementById('pf-rel-d').textContent = s.relD;
  document.getElementById('nav-explore-l').textContent = s.nav[0];
  document.getElementById('nav-card-l').textContent = s.nav[1];
  document.getElementById('nav-profile-l').textContent = s.nav[2];
}

/* ================= render ================= */
function hasProfile(){ return profile.cond.length+profile.alg.length+profile.rel.length>0 || (profile.etc && profile.etc.trim().length>0); }
function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const PLATE_ICON = {g:'✓', y:'!', r:'✕'};

function renderProfileStrip(){
  const s = t();
  const nat = NATIONS.find(n=>n.id===profile.nation);
  const tags = [
    ...(nat?[nat.flag+' '+(nat.label[uiLang]||nat.label.en)]:[]),
    ...profile.cond.map(i=>lbl(CONDITIONS.find(x=>x.id===i)).split(' (')[0].split('（')[0]),
    ...profile.alg.map(i=>lbl(ALLERGENS.find(x=>x.id===i))),
    ...profile.rel.map(i=>lbl(RELIGIOUS.find(x=>x.id===i)).split(' (')[0].split('（')[0]),
  ];
  document.getElementById('profile-strip').innerHTML = tags.length
    ? tags.map(x=>`<span class="ptag">${x}</span>`).join('')
    : `<span class="ptag empty">${s.empty}</span>`;
}

function renderExplore(){
  const s = t(); const area = AREAS[areaKey];
  document.getElementById('area-name').textContent = loc(area.name);
  document.getElementById('rest-count-label').textContent = s.restCount(loc(area.name), area.restaurants.length);
  document.getElementById('rest-list').innerHTML = area.restaurants.map(r=>{
    const v = judgeRestaurant(r);
    return `<div class="rest-card" onclick="openDetail('${r.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openDetail('${r.id}')">
      <div class="plate ${v.level}">${PLATE_ICON[v.level]}</div>
      <div class="rest-info">
        <div class="rest-name">${r.name}${r.halalCert?` <span class="halal-badge">HALAL</span>`:''}</div>
        <div class="rest-cat">${loc(r.cat)} · ${loc(r.dist)}</div>
        <div class="rest-verdict ${v.level}">${v.text}</div>
        <div class="rest-meta">${s.srcTour}</div>
      </div>
    </div>`;
  }).join('');
}

function menuTitle(m){
  const ko = m.name.ko;
  if(uiLang==='ko') return `<div class="menu-name">${ko}</div>`;
  return `<div class="menu-name">${ko}<small>${m.name.en}</small></div>`;
}

function openDetail(id){
  const s = t();
  const r = AREAS[areaKey].restaurants.find(x=>x.id===id);
  const v = judgeRestaurant(r);
  document.getElementById('scr-detail').innerHTML = `
    <div class="detail-hero">
      <button class="back-btn" onclick="go('explore')">${s.back}</button>
      <div class="detail-name">${r.name}</div>
      <div class="detail-sub">${loc(r.cat)} · ${s.detailSub(loc(AREAS[areaKey].name))}</div>
      <span class="detail-badge ${v.level}">${PLATE_ICON[v.level]} ${v.text}</span>
    </div>
    <div class="menu-list">
      ${r.menus.map(m=>{
        const mv = judgeMenu(m);
        return `<div class="menu-item">
          <div class="menu-top">
            <div>${menuTitle(m)}<div class="menu-price">${m.price}</div></div>
            <span class="mbadge ${mv.level}">${s.badge[mv.level]}</span>
          </div>
          <div class="menu-reasons">
            ${mv.reasons.map(rs=>`<div class="reason ${rs.level}">·&nbsp;<span>${rs.text}</span></div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="source-note">${s.detailNote}</div>`;
  go('detail');
}

/* ================= reco ================= */
function renderReco(){
  const s = t(); const box = document.getElementById('reco-section');
  const nat = NATIONS.find(n=>n.id===profile.nation);
  if(!nat || nat.id==='kr'){ box.innerHTML=''; return; }
  const dishes = nat.dishes || DISHES_GLOBAL;
  box.innerHTML = `
    <div class="section-label">${s.recoTitle(nat.flag, nat.label[uiLang]||nat.label.en)}</div>
    <div class="reco-scroll">
      ${dishes.map((d,i)=>{
        const v = judgeMenu(d);
        const firstReason = v.reasons[0] ? v.reasons[0].text.replace(/<[^>]+>/g,'') : '';
        return `<div class="reco-card">
          <div class="reco-rank">${s.recoRank(i+1)}</div>
          <div class="reco-name">${d.name.ko}${uiLang!=='ko'?`<small>${d.name.en}</small>`:''}</div>
          <span class="reco-badge ${v.level}">${s.badge[v.level]}</span>
          <div class="reco-note">${firstReason}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="reco-src">${s.recoSrc}</div>`;
}

/* ================= safecard / dietary ID ================= */
const LANGS = {en:'English', zh:'中文', ja:'日本語', ar:'العربية'};
const PROF_HINT = {
  ko:'식당에서 사장님께 이 카드를 보여주세요. 재료 확인이 훨씬 쉬워져요.',
  en:'Show this card to the restaurant owner — it makes checking ingredients so much easier.',
  ja:'お店でこのカードを見せてください。食材の確認がずっと簡単になります。',
  zh:'在餐厅向老板出示此卡，确认食材会容易得多。',
  ar:'أظهر هذه البطاقة لصاحب المطعم — سيسهّل ذلك التحقق من المكونات كثيراً.',
};
function koRestrictions(){
  const no = [], caution = [];
  profile.alg.forEach(a=>no.push(ALLERGENS.find(x=>x.id===a).label.ko.split('(')[0].trim()));
  if(profile.rel.includes('halal')){ no.push('돼지고기','술(요리술 포함)'); }
  if(profile.rel.includes('kosher')){ no.push('돼지고기','새우·게·조개'); caution.push('고기+유제품 함께 ✕'); }
  if(profile.rel.includes('hindu')){ no.push('쇠고기'); }
  if(profile.rel.includes('buddhist')){ no.push('고기','생선','마늘·파(오신채)'); }
  if(profile.rel.includes('vegan')){ no.push('고기','생선','계란','우유·유제품'); }
  if(profile.rel.includes('vegi')){ no.push('고기','생선','고기 육수'); }
  if(profile.rel.includes('pesco')){ no.push('고기(생선은 괜찮아요)'); }
  if(profile.cond.includes('sodium')) caution.push('짠 음식 · 국물 (나트륨)');
  if(profile.cond.includes('sugar')) caution.push('단 음식 (당류)');
  if(profile.cond.includes('gout')) caution.push('내장 · 진한 육수 · 해산물 (퓨린)');
  if(profile.cond.includes('lipid')) caution.push('기름진 음식 · 튀김');
  if(profile.cond.includes('gerd')) caution.push('맵고 자극적인 음식');
  if(profile.cond.includes('gluten')) no.push('밀가루(글루텐)');
  return {no:[...new Set(no)], caution};
}
function cardNo(){
  const seed = [profile.nation||'', ...profile.alg, ...profile.rel, ...profile.cond].join('');
  let h = 7; for(const c of seed) h = (h*31 + c.charCodeAt(0)) % 9973;
  return 'SP-2026-' + String(1000 + (h % 9000));
}
function qrSVG(){
  const seed = cardNo(); let h = 3;
  const rnd = ()=>{ h = (h*1103515245 + 12345) % 2147483647; return h % 100 < 46; };
  for(const c of seed) h = (h*31 + c.charCodeAt(0)) % 2147483647;
  const n=13, cell=3; let rects='';
  const finder=(x,y)=>`<rect x="${x*cell}" y="${y*cell}" width="${cell*3}" height="${cell*3}" fill="#123B32"/><rect x="${(x+1)*cell}" y="${(y+1)*cell}" width="${cell}" height="${cell}" fill="#F3F8F5"/>`;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if((r<3&&c<3)||(r<3&&c>n-4)||(r>n-4&&c<3)) continue;
    if(rnd()) rects+=`<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="#123B32"/>`;
  }
  return `<svg class="id-qr" width="46" height="46" viewBox="0 0 ${n*cell} ${n*cell}" aria-hidden="true">${rects}${finder(0,0)}${finder(n-3,0)}${finder(0,n-3)}</svg>`;
}
function idCardHTML(){
  const nat = NATIONS.find(n=>n.id===profile.nation);
  const {no, caution} = koRestrictions();
  const today = new Date();
  const issued = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  return `
  <div class="idcard">
    <div class="id-head">
      <div>
        <div class="id-title">식이 제약 안내 카드</div>
        <div class="id-title-en">DIETARY CARE CARD · SAFEPLATE KOREA</div>
      </div>
      <div class="id-emblem">SP</div>
    </div>
    <div class="id-body">
      <div class="id-photo">
        <span class="flag">${nat?nat.flag:'🌏'}</span>
        <span class="cc">${nat?nat.id.toUpperCase():'INTL'}</span>
      </div>
      <div class="id-fields">
        <div class="id-field">
          <label>국적 / NATIONALITY</label>
          <div class="val">${nat?(nat.label.ko + ' · ' + nat.label.en):'—'}</div>
        </div>
        <div class="id-field">
          <label>먹을 수 없어요 / CANNOT EAT</label>
          ${no.length?`<div class="id-noeat">${no.map(x=>`<span>✕ ${x}</span>`).join('')}</div>`:`<div class="val" style="opacity:.7">—</div>`}
        </div>
        ${caution.length?`<div class="id-field">
          <label>주의가 필요해요 / PLEASE BE CAREFUL</label>
          <div class="id-caution">${caution.map(x=>`<span>! ${x}</span>`).join('')}</div>
        </div>`:''}
      </div>
    </div>
    ${profile.etc && profile.etc.trim() ? `<div class="id-field" style="margin-top:11px;position:relative">
      <label>기타 요청 / OTHER NOTES</label>
      <div class="val" style="font-weight:500;font-size:12px;line-height:1.5">${esc(profile.etc.trim())}</div>
    </div>` : ''}
    <div class="id-msg">사장님, 위 재료가 들어가는지 확인 부탁드립니다. 감사합니다 🙏</div>
    <div class="id-foot">
      <div class="meta">NO. ${cardNo()}<br>ISSUED ${issued} · VALID WITH TRAVELER</div>
      ${qrSVG()}
    </div>
  </div>`;
}
function renderCard(){
  const s = t(); const body = document.getElementById('card-body');
  if(!hasProfile()){
    body.innerHTML = `<div class="empty-note">${s.cardEmpty}<br><button class="cta" style="max-width:230px" onclick="go('profile')">${s.cardRegister}</button></div>`;
    return;
  }
  const sub = STR[currentLang] || STR.en;
  body.innerHTML = `
    <div class="card-intro">${s.cardIntro}</div>
    ${idCardHTML()}
    <div class="lang-row">
      ${Object.entries(LANGS).map(([k,v])=>`<button class="lang-btn ${k===currentLang?'on':''}" onclick="setLang('${k}')">${v}</button>`).join('')}
    </div>
    <div class="card-intro" dir="auto" style="margin-top:4px">${sub.cardSub} ${sub.cardQ}</div>
    <div class="card-hint">${s.cardHint}</div>`;
}
function setLang(l){ currentLang=l; renderCard(); }
function renderProfileCard(){
  const slot = document.getElementById('pf-card-slot');
  if(!hasProfile()){ slot.innerHTML=''; return; }
  slot.innerHTML = idCardHTML() + `<div class="pf-card-hint">💳 ${PROF_HINT[uiLang]||PROF_HINT.en}</div>`;
}

/* ================= chips ================= */
function renderChips(containerId, items, group){
  const el = document.getElementById(containerId);
  el.innerHTML = items.map(it=>{
    const on = profile[group].includes(it.id);
    return `<button class="chip ${on?'on':''}" onclick="toggleChip('${group}','${it.id}')">${lbl(it)}</button>`;
  }).join('');
}
function renderNationChips(){
  const el = document.getElementById('pf-nat');
  el.innerHTML = NATIONS.map(n=>{
    const on = profile.nation===n.id;
    return `<button class="chip ${on?'on':''}" onclick="setNationInApp('${n.id}')">${n.flag} ${n.label[uiLang]||n.label.en}</button>`;
  }).join('');
}
function renderNationHints(){
  const s = t();
  const nat = NATIONS.find(n=>n.id===profile.nation);
  ['pf-nat-hint','ob-nat-hint'].forEach(id=>{
    const h = document.getElementById(id);
    if(nat && nat.suggest){ h.textContent = '💡 ' + (nat.suggest==='halal'?s.suggestHalal:s.suggestVegi); h.classList.add('show'); }
    else h.classList.remove('show');
  });
}
function setNationInApp(id){
  profile.nation = (profile.nation===id)? null : id;
  const n = NATIONS.find(x=>x.id===profile.nation);
  if(n){ uiLang = n.lang; currentLang = (n.lang==='ko')?'en':n.lang; }
  applyDir(); renderStatic(); refresh();
}
function toggleChip(group,id){
  const i = profile[group].indexOf(id);
  if(i>=0) profile[group].splice(i,1); else profile[group].push(id);
  refresh();
}

/* ================= navigation ================= */
function go(name){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById('scr-'+name).classList.add('active');
  ['explore','card','profile'].forEach(n=>{
    document.getElementById('nav-'+n).classList.toggle('on', n===name || (name==='detail'&&n==='explore'));
  });
  if(name==='card') renderCard();
  document.querySelector('main').scrollTop = 0;
}
function toggleArea(){ areaKey = areaKey==='myeongdong' ? 'jeonju' : 'myeongdong'; refresh(); go('explore'); }

function refresh(){
  renderChips('pf-cond', CONDITIONS, 'cond');
  renderChips('pf-alg', ALLERGENS, 'alg');
  renderChips('pf-rel', RELIGIOUS, 'rel');
  renderChips('ob-cond', CONDITIONS, 'cond');
  renderChips('ob-alg', ALLERGENS, 'alg');
  renderChips('ob-rel', RELIGIOUS, 'rel');
  renderNationChips(); renderNationHints();
  renderProfileStrip(); renderExplore(); renderReco(); renderProfileCard();
  if(document.getElementById('scr-card').classList.contains('active')) renderCard();
}

renderWelcome(); renderStatic(); refresh();
</script>
</body>
