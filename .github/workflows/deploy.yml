name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 서버(SSH) 배포 — 리포지토리 Variables에 DEPLOY_ENABLED=true 설정 시에만 실행.
  # 필요한 Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, TOUR_API_KEY, MFDS_API_KEY
  deploy:
    needs: build-push
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # 패키지가 private면 필요, public이면 무해하게 통과. repo visibility와 무관하다.
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest
            docker rm -f safeplate 2>/dev/null || true
            docker run -d --name safeplate --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              --memory=400m --memory-swap=700m \
              -e TOUR_API_KEY='${{ secrets.TOUR_API_KEY }}' \
              -e MFDS_API_KEY='${{ secrets.MFDS_API_KEY }}' \
              -e STATS_DIR=/app/data \
              -v safeplate-data:/app/data \
              ghcr.io/${{ github.repository }}:latest
            docker image prune -f
